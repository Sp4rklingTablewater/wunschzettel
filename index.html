<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geburtstagswunschliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <p class="eyebrow">Meine Geburtstagswunschliste</p>
  <h1 id="page-title">Was ich mir wünsche</h1>
  <p class="hero-sub">Klick auf ein Kärtchen und schnapp dir den Wunsch. Ist er einmal vergeben, sehen es alle anderen sofort — so gibt's kein doppeltes Geschenk.</p>
</header>

<main>
  <div id="tag-grid" class="tag-grid">
    <p class="loading">Wünsche werden geladen …</p>
  </div>
</main>

<footer>
  <p>Mit &#9825; zusammengestellt.</p>
</footer>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <p id="modal-text">Wie heißt du?</p>
    <input id="name-input" type="text" placeholder="z. B. Oma Erika" maxlength="40">
    <div id="amount-field" class="hidden">
      <label for="amount-input">Betrag (nur du siehst diese Zahl später)</label>
      <input id="amount-input" type="number" inputmode="decimal" min="1" step="0.01" placeholder="z. B. 20">
    </div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-ghost">Abbrechen</button>
      <button id="modal-confirm" class="btn-solid">Ich schenke das!</button>
    </div>
  </div>
</div>

<script type="module" src="items.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
